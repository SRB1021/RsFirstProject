<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Pacman - Multiplayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Lobby screen shown before joining -->
  <div id="lobby">
    <h1>Ghost Pacman</h1>
    <p>Chase Pacman as a ghost — or play as Pacman himself!</p>

    <input type="text" id="nameInput" placeholder="Your name" maxlength="16">

    <!-- Step 1: create or join -->
    <div id="roomSelect">
      <button id="soloBtn">Play Solo (as Pac-Man)</button>
      <div class="or-divider">— or multiplayer —</div>
      <button id="createRoomBtn">Create Lobby</button>
      <div class="or-divider">— or —</div>
      <div class="join-row">
        <input type="text" id="roomCodeInput" placeholder="Room code" maxlength="4">
        <button id="joinRoomBtn">Find Lobby</button>
      </div>
    </div>

    <!-- Step 2: character picker (shown after room is found/created) -->
    <div id="roomInfo" style="display:none;">
      <div id="roomCodeDisplay">
        Room code: <span id="roomCodeText"></span>
        <button id="copyCodeBtn" title="Copy code">&#128203;</button>
      </div>

      <p class="section-label">Choose your character:</p>
      <div id="ghostPicker">
        <div class="ghost-option selected" data-ghost="Blinky">
          <canvas width="60" height="64"></canvas>
          <span>Blinky</span>
        </div>
        <div class="ghost-option" data-ghost="Pinky">
          <canvas width="60" height="64"></canvas>
          <span>Pinky</span>
        </div>
        <div class="ghost-option" data-ghost="Inky">
          <canvas width="60" height="64"></canvas>
          <span>Inky</span>
        </div>
        <div class="ghost-option" data-ghost="Clyde">
          <canvas width="60" height="64"></canvas>
          <span>Clyde</span>
        </div>
        <div class="ghost-option" data-ghost="Pacman">
          <canvas width="60" height="64"></canvas>
          <span>Pac-Man</span>
        </div>
      </div>

      <button id="joinBtn">Play!</button>
    </div>

    <p id="lobbyMsg"></p>
  </div>

  <!-- Game screen shown while playing -->
  <div id="gameScreen" style="display:none;">
    <div id="statusBar">
      <span id="playerLabel">You are: </span>
      <span id="dotsLabel">Dots left: </span>
      <span id="playersLabel">Players online: 0/4</span>
      <span id="roomCodeLabel">Room: —</span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <!-- Virtual joystick — visible on touch devices only -->
    <div id="joyBase"><div id="joyThumb"></div></div>

    <div id="overlay" style="display:none;">
      <h2 id="overlayTitle"></h2>
      <button id="restartBtn">Play Again</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
